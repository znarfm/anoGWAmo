name: Release Extension

on:
  push:
    tags:
      - 'v*' # Triggers on semantic versioning tags (e.g. v1.0.0)
  workflow_dispatch: # Allows manual execution from the Actions tab

permissions:
  contents: write

jobs:
  build_and_publish:
    name: Build & Release Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Checks & Tests
        run: |
          bun run check
          bun test

      - name: Build Extension Archives
        run: bun run build

      - name: GitHub Release Creation
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/anoGWAmo-chrome.zip
            dist/anoGWAmo-firefox.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Publish to Web Stores
        uses: wxt-dev/publish-extension@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Chrome Web Store
          chrome-zip: dist/anoGWAmo-chrome.zip
          chrome-extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          chrome-client-id: ${{ secrets.CHROME_CLIENT_ID }}
          chrome-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          chrome-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

          # Firefox Add-ons (AMO)
          firefox-zip: dist/anoGWAmo-firefox.zip
          firefox-extension-id: ${{ secrets.FIREFOX_EXTENSION_ID || 'ano.gwa.mo@meinard.dev' }}
          firefox-jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          firefox-jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}

          # Microsoft Edge Add-ons
          edge-zip: dist/anoGWAmo-chrome.zip
          edge-product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          edge-client-id: ${{ secrets.EDGE_CLIENT_ID }}
          edge-client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          edge-access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}