name: Release Extension

on:
  push:
    tags:
      - 'v*' # Triggers on semantic versioning tags (e.g. v1.0.0)
  workflow_dispatch:
    inputs:
      target:
        description: 'Target store to publish to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - firefox
          - chrome
          - edge

permissions:
  contents: write

jobs:
  build_and_publish:
    name: Build & Release Extension
    runs-on: ubuntu-latest

    env:
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Checks & Tests
        run: |
          bun run check
          bun test

      - name: Build Extension Archives
        run: bun run build

      - name: GitHub Release Creation
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/anoGWAmo-chrome.zip
            dist/anoGWAmo-firefox.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Chrome Web Store (https://github.com/mnao305/chrome-extension-upload)
      - name: Publish to Chrome Web Store
        id: publish_chrome
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        if: env.CHROME_CLIENT_ID != '' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'chrome' || github.event_name == 'push')
        continue-on-error: true
        with:
          file-path: dist/anoGWAmo-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      # Microsoft Edge Add-ons (https://github.com/wdzeng/edge-addon)
      - name: Publish to Edge Add-ons
        id: publish_edge
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        if: env.EDGE_CLIENT_ID != '' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'edge' || github.event_name == 'push')
        continue-on-error: true
        with:
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: dist/anoGWAmo-chrome.zip

      # Firefox Add-ons (https://github.com/wdzeng/firefox-addon)
      - name: Publish to Firefox AMO
        id: publish_firefox
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1.2.1
        if: env.FIREFOX_JWT_ISSUER != '' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'firefox' || github.event_name == 'push')
        continue-on-error: true
        with:
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          addon-guid: ano.gwa.mo@meinard.dev
          xpi-path: dist/anoGWAmo-firefox.zip

      # Aggregated Store Publishing Status
      - name: Verify Publishing Outcomes
        if: always()
        run: |
          chrome_outcome="${{ steps.publish_chrome.outcome }}"
          edge_outcome="${{ steps.publish_edge.outcome }}"
          firefox_outcome="${{ steps.publish_firefox.outcome }}"

          echo "Chrome upload outcome:  ${chrome_outcome:-skipped}"
          echo "Edge upload outcome:    ${edge_outcome:-skipped}"
          echo "Firefox upload outcome: ${firefox_outcome:-skipped}"

          if [ "$chrome_outcome" = "failure" ] || [ "$edge_outcome" = "failure" ] || [ "$firefox_outcome" = "failure" ]; then
            echo "::error::One or more store publishing steps encountered an error."
            exit 1
          fi
